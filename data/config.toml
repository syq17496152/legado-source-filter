# 通用回退关键词：在 checkKeyWord 和域名匹配书都不可用时使用。
# 注意：这些是网文最高频词，几乎所有源都能搜出结果，区分度低；
# 建议针对目标站点补充更具体的 [[search]] 条目（含 domain）。
[test]
generic_keywords = ["重生", "系统", "穿越"]

# static 探测关键词：链路验证通过后，用这个"冷门"词再搜一次；
# 若结果与主关键词几乎完全重合，说明该源搜索可能写死（永远返回同一页）。
# 命中源仍保留 passed（链路确实可读），但会写入 static.json 供人工复核。
static_probe_keywords = ["zzzzz"]

# passed 源缓存有效期（天）：超过后自动重测（0 = 永不过期，信任缓存）。
# failed 源始终重测，不受此影响。
cache_ttl_days = 0
